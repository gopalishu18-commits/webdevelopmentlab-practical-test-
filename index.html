<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <h1>Student Expense Tracker</h1>
            <p class="subtitle">Manage your daily student expenses efficiently</p>
        </header>

        <div class="dashboard-grid">
            <!-- Input Form Section -->
            <section class="card form-card">
                <h2>Add New Expense</h2>
                <form>
                    <div class="form-group">
                        <label for="expense-name">Expense Name</label>
                        <input type="text" id="expense-name" placeholder="e.g., Textbook, Lunch" required>
                    </div>

                    <div class="form-group">
                        <label for="expense-amount">Amount ($)</label>
                        <input type="number" id="expense-amount" placeholder="0.00" min="0.01" step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label for="expense-category">Category</label>
                        <select id="expense-category" required>
                            <option value="" disabled selected>Select category</option>
                            <option value="Food">Food</option>
                            <option value="Travel">Travel</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Education">Education</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-primary">Add Expense</button>
                </form>
            </section>

            <!-- Display & Filter Section -->
            <section class="card display-card">
                <div class="display-header">
                    <h2>Expense Records</h2>
                    <div class="filter-group">
                        <label for="category-filter">Filter:</label>
                        <select id="category-filter">
                            <option value="All">All Categories</option>
                            <option value="Food">Food</option>
                            <option value="Travel">Travel</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Education">Education</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <!-- Expense Table/List -->
                <div class="table-responsive">
                    <table class="expense-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Amount</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>College Textbook</td>
                                <td><span class="badge education">Education</span></td>
                                <td>$45.00</td>
                                <td><button class="btn-delete" title="Delete">×</button></td>
                            </tr>
                            <tr>
                                <td>Bus Pass</td>
                                <td><span class="badge travel">Travel</span></td>
                                <td>$20.00</td>
                                <td><button class="btn-delete" title="Delete">×</button></td>
                            </tr>
                            <tr>
                                <td>Cafeteria Lunch</td>
                                <td><span class="badge food">Food</span></td>
                                <td>$8.50</td>
                                <td><button class="btn-delete" title="Delete">×</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Total Display -->
                <div class="total-container">
                    <h3>Total Expenses: <span id="total-amount">$73.50</span></h3>
                </div>
            </section>
        </div>
    </div>

</body>
</html>
